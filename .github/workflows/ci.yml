name: CI

# Roda no develop: cada commit chega lá por `make finish`, e o PR de release e o main recebem exatamente esse commit
# (o GitHub mostra no PR os checks do commit). Rodar de novo no PR e no main só repetiria o mesmo trabalho.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (make ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O mesmo gate de quem desenvolve: formatação, vet, golangci-lint (com o staticcheck) e os testes, com o
      # xmllint, no container de docker/dev. O que passa aqui passa no `make finish`.
      - name: Imagem de desenvolvimento
        run: make image

      - name: make ci
        run: make ci

  testes:
    name: Testes (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # O mínimo do go.mod; a versão recente já roda no gate.
          - os: ubuntu-latest
            go: '1.23'
          # Caminhos e quebras de linha de outro sistema.
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # O pacote xsd valida os documentos contra os esquemas oficiais pelo xmllint (sem CGO). No Windows, esses
      # testes são pulados.
      - name: Instalar o xmllint
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Conferir go.mod e go.sum
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Testes
        run: go test -count=1 ./...

  corrida:
    name: Corrida, cobertura e vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Instalar o xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # O detector de corrida exige CGO. A mesma execução mede a cobertura.
      - name: Testes com -race
        run: go test -race -count=1 -coverprofile=cobertura.out -covermode=atomic ./...
        env:
          CGO_ENABLED: '1'

      - name: Resumo da cobertura
        run: |
          go tool cover -func=cobertura.out > resumo.txt
          {
            echo "### Cobertura total: $(awk '/^total:/ {print $3}' resumo.txt)"
            echo '```'
            cat resumo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # No Go estável, o que quem usa a biblioteca compila; o Go do container de docker/dev pode estar atrás.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
