# Configuracao do fluxo git deste projeto. Lido por scripts/flow-lib.sh.
# So o que difere do padrao precisa estar aqui.

STACK=go

# O gate que `make finish`, `make release` e o pre-push rodam.
GATE_CMD="make ci"

# 1 = o pre-push roda o gate para toda arvore enviada que nunca passou nele.
PREPUSH_GATE=1

# O formato e conferido no gate, em container; nao ha gofmt no host.
FORMAT_ON_COMMIT=0

# Tamanho maximo do assunto do commit.
SUBJECT_MAX=72

# O CHANGELOG e escrito a mao (Keep a Changelog), na secao "Nao lancado"; a
# release so a renomeia para a versao. Commit comum pode mexer nessa secao e so nela.
CHANGELOG_MODE=curated

# 1 = recusa coautoria e sessao de assistente na mensagem: o autor e quem operou.
REFUSE_AI_COAUTHOR=1

# Biblioteca: sem deploy. O `make ship` so move main para a release.
DEPLOY_WORKFLOW=""
RELEASE_BUILD_WORKFLOW=""

# Sem board: o andamento e acompanhado fora deste repositorio, e as issues
# daqui ficam desativadas. O fluxo nao mexe em cartao.
BOARD_OWNER=""
BOARD_PROJECT=""
